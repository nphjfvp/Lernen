name: Android APK

# Baut bei jedem Push eine installierbare APK. Landet an zwei Stellen:
#  1. Als "android-latest"-Release mit fester URL (softprops/action-gh-release
#     aktualisiert bei jedem Lauf denselben Release/Tag statt neue anzulegen)
#     - direkter .apk-Download ohne ZIP-Umweg, auch vom Handy aus.
#  2. Zusätzlich als Workflow-Artifact am Actions-Run (30 Tage, falls mal
#     genau der Build zu einem bestimmten Commit gebraucht wird).
# Release-Build wird mit dem Debug-Keystore signiert (siehe
# android/app/build.gradle.kts) - installiert direkt auf jedem Gerät, ist
# aber kein Play-Store-fähiges Signing.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Qualitäts-Gate: ohne sauberen Analyzer und grüne Tests wird nichts
      # gebaut oder veröffentlicht – sonst landen Regressionen still in der
      # "latest"-Version, die sich die App per Update-Check holt.
      - name: Analyzer
        run: flutter analyze

      - name: Tests
        run: flutter test

      # --build-number = fortlaufende Actions-Run-Nummer, NIE doppelt und
      # immer aufsteigend über alle Pushes hinweg (anders als die
      # pubspec.yaml-Versionsnummer, die man leicht vergisst hochzuzählen) -
      # Grundlage für den In-App-Update-Check (siehe UpdateCheckerService),
      # der genau diese Zahl mit der laufenden App vergleicht.
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: version.json für den In-App-Update-Check schreiben
        run: |
          cat > version.json <<EOF
          {"buildNumber": ${{ github.run_number }}, "sha": "${{ github.sha }}", "tag": "android-latest"}
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: lernen-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Aktuellen Stand als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android APK (aktueller Stand)
          body: |
            Automatisch gebaut aus Commit ${{ github.sha }} auf ${{ github.ref_name }}.
            Mit dem Debug-Keystore signiert (siehe android/app/build.gradle.kts) -
            installiert direkt auf jedem Gerät, ist aber kein Play-Store-Signing.
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
