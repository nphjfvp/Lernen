name: Windows App

# Baut bei jedem Push eine native Windows-Desktop-App (kein Emulator nötig).
# Landet an zwei Stellen, analog zu android-apk.yml:
#  1. Als "windows-latest"-Release mit fester URL (softprops/action-gh-release
#     aktualisiert bei jedem Lauf denselben Release/Tag statt neue anzulegen)
#     - Lernen-Setup.exe: EINE Datei, installiert die App für den aktuellen
#       Nutzer (windows/installer/lernen.iss, Inno Setup) - Grundlage auch
#       für das Update aus der App heraus.
#     - lernen-windows.zip: dieselbe App zum Entpacken (portable).
#  2. Zusätzlich als Workflow-Artifact am Actions-Run (30 Tage).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.3"
          channel: stable
          cache: true

      - name: Windows-Desktop-Unterstützung aktivieren
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      # Qualitäts-Gate: ohne sauberen Analyzer und grüne Tests wird nichts
      # gebaut oder veröffentlicht – sonst landen Regressionen still in der
      # "latest"-Version, die sich die App per Update-Check holt.
      - name: Analyzer
        run: flutter analyze

      - name: Tests
        run: flutter test

      # --build-number = fortlaufende Actions-Run-Nummer, NIE doppelt und
      # immer aufsteigend über alle Pushes hinweg - Grundlage für den
      # In-App-Update-Check (siehe UpdateCheckerService).
      - name: Build release Windows-App
        run: flutter build windows --release --build-number=${{ github.run_number }}

      - name: Build-Ordner ermitteln und als ZIP packen
        shell: pwsh
        run: |
          $releaseDir = Get-ChildItem -Path build/windows -Recurse -Directory -Filter Release |
            Where-Object { $_.FullName -match '\\runner\\Release$' } |
            Select-Object -First 1
          if (-not $releaseDir) {
            throw "Release-Ordner (runner/Release) wurde nicht gefunden."
          }
          Compress-Archive -Path "$($releaseDir.FullName)\*" -DestinationPath lernen-windows.zip
          "RELEASE_DIR=$($releaseDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Inno Setup ist auf den Windows-Runnern meist vorinstalliert, sonst
      # über Chocolatey nachholen.
      - name: Installer bauen (Lernen-Setup.exe)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nicht gefunden." }
          & $iscc "/DAppVersion=1.0.${{ github.run_number }}" "/DSourceDir=$env:RELEASE_DIR" "/O$PWD" windows\installer\lernen.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer-Build fehlgeschlagen." }
          if (-not (Test-Path Lernen-Setup.exe)) { throw "Lernen-Setup.exe fehlt." }

      - name: version.json für den In-App-Update-Check schreiben
        shell: pwsh
        run: |
          $json = @{
            buildNumber = [int]"${{ github.run_number }}"
            sha         = "${{ github.sha }}"
            tag         = "windows-latest"
          } | ConvertTo-Json
          Set-Content -Path version.json -Value $json

      - uses: actions/upload-artifact@v4
        with:
          name: lernen-windows
          path: |
            Lernen-Setup.exe
            lernen-windows.zip
          retention-days: 30

      - name: Aktuellen Stand als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Windows-App (aktueller Stand)
          body: |
            Automatisch gebaut aus Commit ${{ github.sha }} auf ${{ github.ref_name }}.
            Lernen-Setup.exe herunterladen und ausführen - installiert die App für deinen Benutzer
            (ohne Admin-Rechte) mit Startmenü-/Desktop-Verknüpfung. Updates kommen danach direkt aus der App.
            Alternativ lernen-windows.zip entpacken und lernen.exe starten (portable).
          prerelease: true
          files: |
            Lernen-Setup.exe
            lernen-windows.zip
            version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
