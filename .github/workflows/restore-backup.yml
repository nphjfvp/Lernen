name: Backup wiederherstellen

# Stellt den Code-Stand eines Backup-Tags (backup-…) auf dem App-Zweig wieder
# her – als NEUER Commit: nichts geht verloren, und die Rückkehr lässt sich
# ihrerseits wieder rückgängig machen. Danach werden Android- und Windows-Build
# angestoßen; die App holt sich die wiederhergestellte Version ganz normal über
# den Update-Check (höhere Build-Nummer, die Lerndaten auf dem Gerät bleiben).
#
# Starten: GitHub → Actions → "Backup wiederherstellen" → "Run workflow".
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Backup-Tag, dessen Stand wiederhergestellt wird
        required: true
        default: backup-vor-visuell-lernen
      branch:
        description: Zweig, aus dem die App gebaut wird
        required: true
        default: claude/neue-lern-app-fokus-ej3k48

permissions:
  contents: write
  actions: write

jobs:
  restore:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Stand des Backups übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::Backup-Tag $TAG gibt es nicht."
            exit 1
          fi
          # Ganzen Dateibaum durch den des Backups ersetzen (auch später
          # hinzugekommene Dateien fallen weg).
          git rm -r -q .
          git checkout "refs/tags/$TAG" -- .
          if git diff --cached --quiet; then
            echo "Der Zweig ist schon auf dem Stand von $TAG."
            echo "UNCHANGED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          git commit -q -m "Backup $TAG wiederhergestellt"
          git push origin "HEAD:$BRANCH"

      # Pushes mit dem GITHUB_TOKEN starten keine Workflows – die Builds
      # deshalb ausdrücklich anstoßen.
      - name: Builds anstoßen
        if: env.UNCHANGED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run android-apk.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"
          gh workflow run windows-app.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"
