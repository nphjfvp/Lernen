<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lernen – Lern-App mit Daily Quiz, Karteikarten und KI.">

  <!-- iPad/iPhone: "Teilen → Zum Home-Bildschirm" startet die App im
       Vollbild (ohne Safari-Leisten) – dort bleibt auch der Speicher
       dauerhaft, Safari löscht Daten normaler Websites nach 7 Tagen. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lernen">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E212B" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lernen</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #FAFAF7; }
    @media (prefers-color-scheme: dark) { html, body { background: #1E212B; } }
    /* Ladeanzeige bis zum ersten Bild der App (der erste Start lädt einige MB). */
    #lernen-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #6B7280; transition: opacity .25s;
    }
    #lernen-loading .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid #E7E8F5; border-top-color: #23449A;
      animation: lernen-spin 0.9s linear infinite;
    }
    @keyframes lernen-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="lernen-loading"><div class="spinner"></div>Lernen wird geladen …</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('lernen-loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
    // Lerndaten liegen im Browser (IndexedDB): um dauerhaften Speicher bitten,
    // damit der Browser sie bei Platzmangel nicht von sich aus löscht.
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(function () {});
    }
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- PDF-Anzeige im Browser: syncfusion_flutter_pdfviewer rendert Seiten
       im Web über PdfJs (siehe README des Pakets, "Web integration"). -->
  <script type="module" async>
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/pdf.worker.min.mjs";
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
